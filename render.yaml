services:
  - type: web
    name: charan-mobiles
    runtime: node
    plan: free
    buildCommand: bun install && bun run build
    startCommand: bun start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.3.14
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: CHARAN_OWNER_PASSWORD
        sync: false
      - key: TIGRIS_ENDPOINT
        sync: false
      - key: TIGRIS_REGION
        value: auto
      - key: TIGRIS_BUCKET
        sync: false
      - key: TIGRIS_ACCESS_KEY_ID
        sync: false
      - key: TIGRIS_SECRET_ACCESS_KEY
        sync: false
      - key: TIGRIS_PUBLIC_BASE_URL
        sync: false
